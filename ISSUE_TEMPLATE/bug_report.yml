name: 🐛 Bug 报告
description: 提交一个缺陷
title: "[Bug]: "
labels: ["bug"]
body:
  - type: markdown
    attributes:
      value: |
        提交前请先搜索已有 Issue，避免重复。
        如果是安全漏洞，请勿在此提交，按 [安全策略](https://github.com/MoTeam-cn/.github/blob/main/SECURITY.md) 邮件报告。

  - type: input
    id: version
    attributes:
      label: 版本
      description: 出现问题的版本
      placeholder: "例如 v1.0.0，或 commit 短哈希"
    validations:
      required: true

  - type: textarea
    id: what-happened
    attributes:
      label: 问题描述
      description: 实际发生了什么
      placeholder: 描述你观察到的现象
    validations:
      required: true

  - type: textarea
    id: reproduce
    attributes:
      label: 复现步骤
      description: 如何稳定复现
      placeholder: |
        1. ...
        2. ...
        3. ...
    validations:
      required: true

  - type: textarea
    id: expected
    attributes:
      label: 期望行为
      description: 你预期应该发生什么
      placeholder: 描述期望的结果
    validations:
      required: true

  - type: dropdown
    id: os
    attributes:
      label: 操作系统
      options:
        - Windows
        - macOS
        - Linux
        - 其他
    validations:
      required: true

  - type: textarea
    id: logs
    attributes:
      label: 相关日志
      description: 有报错日志的话贴在这里
      render: shell