name: 💡 功能建议
description: 提出新功能或改进建议
title: "[Feature]: "
labels: ["enhancement"]
body:
  - type: markdown
    attributes:
      value: |
        请先说明使用场景，而不只是想要的实现方式。

  - type: textarea
    id: problem
    attributes:
      label: 场景与问题
      description: 你在什么场景下遇到了什么不便
      placeholder: 描述具体的使用场景
    validations:
      required: true

  - type: textarea
    id: solution
    attributes:
      label: 期望方案
      description: 你希望怎么解决
      placeholder: 描述期望的行为或接口
    validations:
      required: true

  - type: textarea
    id: alternatives
    attributes:
      label: 备选方案
      description: 考虑过哪些其他做法，为什么不合适
      placeholder: 可不填

  - type: textarea
    id: additional
    attributes:
      label: 补充信息
      description: 相关链接、截图或其他上下文

  - type: dropdown
    id: priority
    attributes:
      label: 优先级
      options:
        - 低
        - 中
        - 高
    validations:
      required: true